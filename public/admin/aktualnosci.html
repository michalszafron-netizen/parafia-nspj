<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aktualności · Panel Parafii NSPJ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
  .filters{
    display:flex;gap:10px;align-items:center;background:var(--white);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap
  }
  .filters .tab{
    padding:6px 12px;border-radius:5px;font-size:.85rem;color:var(--ink-soft);
    cursor:pointer;font-weight:600
  }
  .filters .tab.active{background:var(--burgundy);color:#fff}
  .filters .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  .filters select{padding:6px 10px;border:1px solid var(--line);border-radius:5px;font-size:.85rem;background:var(--white);color:var(--ink)}
  .filters .search-in{position:relative;margin-left:auto}
  .filters .search-in input{padding:6px 12px 6px 32px;border:1px solid var(--line);border-radius:5px;font-size:.85rem;background:var(--white);width:240px}
  .filters .search-in svg{position:absolute;left:10px;top:8px;color:var(--ink-soft)}

  .thumb{width:60px;height:42px;border-radius:4px;background-size:cover;background-position:center;background-color:var(--beige-deep);flex-shrink:0}
  .title-cell{display:flex;gap:12px;align-items:center}
  .title-cell .meta{display:flex;flex-direction:column;gap:2px}
  .title-cell b{color:var(--ink);font-size:.92rem;line-height:1.2}
  .title-cell .sub{font-size:.78rem;color:var(--ink-soft)}

  .pagination{
    display:flex;gap:6px;justify-content:center;align-items:center;margin-top:18px;color:var(--ink-soft);font-size:.85rem
  }
  .pagination a,.pagination span{
    padding:6px 11px;border-radius:5px;border:1px solid var(--line);background:var(--white);
    color:var(--ink-soft);text-decoration:none;font-weight:600
  }
  .pagination a.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
  .pagination a:hover{border-color:var(--copper);color:var(--burgundy)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-active="aktualnosci"></aside>
  <script src="assets/sidebar.js"></script>

  <div class="main">
    <div class="topbar">
      <div class="crumbs"><a href="index.html">Pulpit</a><span>/</span><b>Aktualności</b></div>
      <a href="../strony/aktualnosci.html" target="_blank" class="btn btn-ghost sm"><svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/><path d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/></svg> Podgląd</a>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>Aktualności</h1>
          <div class="lead">Wpisy widoczne publicznie na stronie parafii · wszystkich: <b id="news-total">0</b></div>
        </div>
        <div class="right">
          <a href="aktualnosci-edit.html?new=1" class="btn btn-primary">
            <svg fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/></svg>
            Dodaj aktualność
          </a>
        </div>
      </div>

      <!-- POTWIERDZENIE USUNIĘCIA -->
      <div id="del-banner" style="display:none;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px 16px;margin-bottom:14px;display:none;align-items:center;gap:12px;font-size:.88rem">
        <svg width="16" height="16" fill="#991b1b" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>
        <span id="del-banner-msg">Na pewno usunąć wpis?</span>
        <button class="btn btn-danger sm" id="del-confirm-btn">Usuń</button>
        <button class="btn btn-secondary sm" id="del-cancel-btn">Anuluj</button>
      </div>

      <div class="filters">
        <span class="tab active" data-filter="all">Wszystkie (<span class="f-count-all">0</span>)</span>
        <span class="tab" data-filter="published">Opublikowane (<span class="f-count-pub">0</span>)</span>
        <span class="tab" data-filter="draft">Szkice (<span class="f-count-draft">0</span>)</span>
        <div class="sep"></div>
        <select>
          <option>Wszystkie kategorie</option>
          <option>Wydarzenia</option>
          <option>Pielgrzymki</option>
          <option>Budowa kościoła</option>
          <option>Sakramenty</option>
        </select>
        <select>
          <option>Wszystkie lata</option>
          <option>2026</option>
          <option>2025</option>
          <option>2024</option>
        </select>
        <div class="search-in">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
          <input type="text" placeholder="Szukaj w tytułach...">
        </div>
      </div>

      <table class="tbl">
        <thead>
          <tr>
            <th style="width:32px"><input type="checkbox"></th>
            <th>Tytuł</th>
            <th>Status</th>
            <th>Kategoria</th>
            <th>Data publikacji</th>
            <th>Autor</th>
            <th style="text-align:right">Akcje</th>
          </tr>
        </thead>
        <tbody id="news-tbody">
          <!-- wypelniane dynamicznie przez JS -->
        </tbody>
      </table>

      <div class="pagination" id="pagination"></div>

    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" style="position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999"><span id="toast-msg"></span></div>
<style>
.toast.show{opacity:1!important}
.toast.success{background:#166534!important}
.toast.error{background:#991b1b!important}
</style>

<script>
async function apiFetch(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

let allNews = [];
let currentFilter = 'all';
let pendingDeleteId = null;

function fmtDate(iso) {
  if (!iso) return '-';
  try { return new Date(iso + 'T12:00:00').toLocaleDateString('pl-PL', {day:'numeric', month:'long', year:'numeric'}); } catch(e) { return iso; }
}

// ════════════════════════════════════════════════════════
//  RENDER TABLE
// ════════════════════════════════════════════════════════
const SVG_EDIT = '<svg fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/></svg>';
const SVG_EYE = '<svg fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/></svg>';
const SVG_DEL = '<svg fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/></svg>';

function renderTable() {
  const pub = allNews.filter(a => a.status === 'published').length;
  const draft = allNews.filter(a => a.status === 'draft').length;
  document.getElementById('news-total').textContent = allNews.length;
  document.querySelectorAll('.f-count-all').forEach(el => el.textContent = allNews.length);
  document.querySelectorAll('.f-count-pub').forEach(el => el.textContent = pub);
  document.querySelectorAll('.f-count-draft').forEach(el => el.textContent = draft);

  const filtered = allNews.filter(a => {
    if (currentFilter === 'published') return a.status === 'published';
    if (currentFilter === 'draft') return a.status === 'draft';
    return true;
  });

  const tbody = document.getElementById('news-tbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:28px">Brak wpisów w tej kategorii</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(a => {
    const isPub = a.status === 'published';
    const authorShort = (a.author || '')
      .replace('ks. Tomasz Żołna', 'ks. Tomasz')
      .replace('ks. Paweł Olszewski', 'ks. Paweł O.');
    const sub = (a.views ? a.views + ' odsłon' : 'brak odsłon') + (a.featured ? ' · ★ wyróżniony' : '');
    const imgUrl = (a.image || '').replace(/"/g, '&quot;');
    return `<tr>
      <td><input type="checkbox"></td>
      <td><div class="title-cell">
        <div class="thumb" style="background-image:url(&quot;${imgUrl}&quot;);background-position:center ${a.image_pos||'40%'}"></div>
        <div class="meta"><b>${a.title}</b><span class="sub">${sub}</span></div>
      </div></td>
      <td><span class="pill-badge ${isPub ? 'pub' : 'draft'}">&#9679; ${isPub ? 'Opublikowany' : 'Szkic'}</span></td>
      <td>${a.category || '-'}</td>
      <td>${fmtDate(a.date)}</td>
      <td>${authorShort}</td>
      <td><div class="row-actions">
        <a href="aktualnosci-edit.html?id=${a.id}" title="Edytuj">${SVG_EDIT}</a>
        <button title="Podgląd" data-preview="${a.id}">${SVG_EYE}</button>
        <button title="Usuń" data-delete="${a.id}">${SVG_DEL}</button>
      </div></td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingDeleteId = btn.dataset.delete;
      const art = allNews.find(a => a.id === pendingDeleteId);
      document.getElementById('del-banner-msg').textContent = `Na pewno usunąć: „${art ? art.title : 'wpis'}"?`;
      const banner = document.getElementById('del-banner');
      banner.style.display = 'flex';
      banner.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });
  tbody.querySelectorAll('[data-preview]').forEach(btn => {
    btn.addEventListener('click', () => {
      window.open('../strony/aktualnosci.html#' + btn.dataset.preview, '_blank');
    });
  });
}

// ════════════════════════════════════════════════════════
//  FILTERS
// ════════════════════════════════════════════════════════
document.querySelectorAll('.tab[data-filter]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab[data-filter]').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderTable();
  });
});

// ════════════════════════════════════════════════════════
//  DELETE CONFIRM
// ════════════════════════════════════════════════════════
document.getElementById('del-confirm-btn').addEventListener('click', async () => {
  if (!pendingDeleteId) return;
  await apiFetch('/api/aktualnosci/' + pendingDeleteId, {method:'DELETE'});
  allNews = allNews.filter(a => a.id !== pendingDeleteId);
  pendingDeleteId = null;
  document.getElementById('del-banner').style.display = 'none';
  renderTable();
  showToast('Wpis został usunięty', 'success');
});
document.getElementById('del-cancel-btn').addEventListener('click', () => {
  pendingDeleteId = null;
  document.getElementById('del-banner').style.display = 'none';
});

// ════════════════════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════════════════════
document.querySelector('.filters .search-in input').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('#news-tbody tr').forEach(row => {
    const b = row.querySelector('b');
    row.style.display = (!b || b.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
});

// ════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.className = 'show ' + (type || 'success');
  document.getElementById('toast-msg').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
(async function(){ allNews = await apiFetch('/api/aktualnosci'); renderTable(); })();
</script>

<script src="assets/admin.js"></script>
<script src="assets/auth-guard.js"></script>
</body>
</html>
